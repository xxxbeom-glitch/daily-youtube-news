name: Music discovery playlist

on:
  workflow_dispatch:
    inputs:
      genre:
        description: Playlist lane to generate
        required: true
        type: choice
        default: hiphop
        options:
          - hiphop
          - rnb
      create_playlist:
        description: Create the private YouTube Music playlist after verification
        required: true
        type: boolean
        default: false
      playlist_title:
        description: Optional temporary test title; blank uses a timestamped test title
        required: false
        type: string
        default: ""
  push:
    branches:
      - main
    paths:
      - "music/**"
      - ".github/workflows/music-playlist-manual.yml"
  pull_request:
    branches:
      - main
    paths:
      - "music/**"
      - ".github/workflows/music-playlist-manual.yml"

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPENAI_CURATOR_MODEL: gpt-5.6-sol
      OPENAI_REASONING_EFFORT: low
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate OpenAI music engine
        run: node music/generate-playlist-openai.mjs --self-test

  credential_preflight:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_CURATOR_MODEL: gpt-5.6-sol
      OPENAI_REASONING_EFFORT: low
      LISTENBRAINZ_TOKEN: ${{ secrets.LISTENBRAINZ_TOKEN }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify OpenAI, ListenBrainz and YouTube credentials
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in OPENAI_API_KEY LISTENBRAINZ_TOKEN GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET YOUTUBE_REFRESH_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Actions secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          node music/generate-playlist-openai.mjs --credential-test

  generate:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[music-openai-once]'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GENRE: ${{ github.event_name == 'workflow_dispatch' && inputs.genre || 'hiphop' }}
      CREATE_PLAYLIST: ${{ github.event_name == 'workflow_dispatch' && inputs.create_playlist || 'false' }}
      PLAYLIST_TITLE: ${{ github.event_name == 'workflow_dispatch' && inputs.playlist_title || '' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_CURATOR_MODEL: gpt-5.6-sol
      OPENAI_REASONING_EFFORT: low
      LISTENBRAINZ_TOKEN: ${{ secrets.LISTENBRAINZ_TOKEN }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      MUSIC_PROFILE_PATH: music/profile.v1.json
      MUSIC_STATE_PATH: .music-state/history.json
      MUSIC_YOUTUBE_CACHE_PATH: .music-state/youtube-cache.json
      MUSIC_OUTPUT_DIR: music-output
      MUSIC_CATALOG_TARGET: ${{ github.event_name == 'push' && '80' || '110' }}
      MUSIC_RERANK_LIMIT: "48"
      MUSIC_TEST_TRACK_LIMIT: ${{ github.event_name == 'push' && '10' || '0' }}
      YOUTUBE_SEARCH_FALLBACK: ${{ github.event_name == 'push' && 'false' || 'true' }}
      YOUTUBE_SEARCH_LIMIT: ${{ github.event_name == 'push' && '0' || '40' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Restore recommendation, YouTube cache and resume state
        uses: actions/cache/restore@v4
        with:
          path: .music-state
          key: music-state-${{ github.run_id }}
          restore-keys: |
            music-state-

      - name: Preflight
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in OPENAI_API_KEY LISTENBRAINZ_TOKEN GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET YOUTUBE_REFRESH_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Actions secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          node music/generate-playlist-openai.mjs --self-test

      - name: Generate and verify playlist candidates
        run: node music/generate-playlist-openai.mjs

      - name: Save recommendation, YouTube cache and resume state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .music-state
          key: music-state-${{ github.run_id }}

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: music-discovery-${{ env.GENRE }}-${{ github.run_id }}
          path: music-output
          if-no-files-found: ignore
          retention-days: 30
