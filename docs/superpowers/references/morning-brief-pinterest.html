<style>
:root{--bg:#161c1a;--fg:#e3e2da;--sub:#b4b5ac;--line:#39423e;--sun:#f0b545}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;word-break:keep-all;line-height:1.5}
main{max-width:1120px;margin:0 auto;padding:32px 16px 64px}

.lead{margin:0;color:var(--sub);font-size:17px;max-width:60ch}
section{margin-top:44px;border-top:1px solid var(--line);padding-top:18px}
h2{font-size:26px;letter-spacing:-.03em;margin:0 0 4px}
section>p{margin:0 0 16px;color:var(--sub);font-size:16px;max-width:60ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;align-items:start}
a{display:block;color:inherit;border-radius:10px;overflow:hidden;background:#222a27}
a:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
img{display:block;width:100%;height:auto}
</style>
</head>
