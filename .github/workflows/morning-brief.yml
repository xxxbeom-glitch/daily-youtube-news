name: Morning brief

on:
  schedule:
    # 07:10 KST. 뒤의 실행은 앞 실행이 늦거나 실패했을 때를 위한 재시도이고, 이미 있으면 건너뛴다.
    - cron: "10 22 * * *"
    - cron: "40 22 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "오늘 파일이 있어도 새로 만든다"
        type: boolean
        default: false

concurrency:
  group: morning-brief
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: morning-brief
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: node scripts/generate.mjs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FORCE: ${{ inputs.force }}
