name: Music discovery playlist

on:
  workflow_dispatch:
    inputs:
      genre:
        description: Playlist lane to generate
        required: true
        type: choice
        default: hiphop
        options:
          - hiphop
          - rnb
      create_playlist:
        description: Create the private YouTube Music playlist after verification
        required: true
        type: boolean
        default: true
      playlist_title:
        description: Optional temporary test title; blank uses a timestamped test title
        required: false
        type: string
        default: ""
  push:
    branches:
      - main
    paths:
      - "music/**"
      - ".github/workflows/music-playlist-manual.yml"
  pull_request:
    branches:
      - main
    paths:
      - "music/**"
      - ".github/workflows/music-playlist-manual.yml"

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GEMINI_PREFILTER_MODEL: gemini-3.1-flash-lite
      GEMINI_CURATOR_MODEL: gemini-3.6-flash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate Gemini music engine
        run: node music/generate-playlist-gemini.mjs --self-test

  credential_preflight:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_PREFILTER_MODEL: gemini-3.1-flash-lite
      GEMINI_CURATOR_MODEL: gemini-3.6-flash
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify Gemini and YouTube credentials
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in GEMINI_API_KEY GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET YOUTUBE_REFRESH_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Actions secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          node music/generate-playlist-gemini.mjs --credential-test

  generate:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[music-gemini-once]'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GENRE: ${{ github.event_name == 'workflow_dispatch' && inputs.genre || 'hiphop' }}
      CREATE_PLAYLIST: ${{ github.event_name == 'workflow_dispatch' && inputs.create_playlist || 'true' }}
      PLAYLIST_TITLE: ${{ github.event_name == 'workflow_dispatch' && inputs.playlist_title || '' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_PREFILTER_MODEL: gemini-3.1-flash-lite
      GEMINI_CURATOR_MODEL: gemini-3.6-flash
      MAX_GEMINI_CALLS_PER_RUN: "5"
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      MUSIC_PROFILE_PATH: music/profile.v1.json
      MUSIC_STATE_PATH: .music-state/history.json
      MUSIC_OUTPUT_DIR: music-output
      MUSIC_CATALOG_TARGET: "140"
      MUSIC_CURATOR_LIMIT: "50"
      YOUTUBE_SEARCH_LIMIT: "60"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Restore recommendation and resume state
        uses: actions/cache/restore@v4
        with:
          path: .music-state
          key: music-state-${{ github.run_id }}
          restore-keys: |
            music-state-

      - name: Preflight
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in GEMINI_API_KEY GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET YOUTUBE_REFRESH_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Actions secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          node music/generate-playlist-gemini.mjs --self-test

      - name: Generate and verify playlist
        run: node music/generate-playlist-gemini.mjs

      - name: Save recommendation and resume state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .music-state
          key: music-state-${{ github.run_id }}

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: music-discovery-${{ env.GENRE }}-${{ github.run_id }}
          path: music-output
          if-no-files-found: ignore
          retention-days: 30
